<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REPTEC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>
    <div class="wrapper">
        <aside>
            <header>
                <h1 class="logo">REPTEC</h1>
            </header>
            <nav>
                <ul class="menu">
                    <li>
                        <button id="todos" class="boton-menu boton-categoria active">
                            <i class="bi bi-hand-index-thumb-fill"></i> Todos los productos
                        </button>
                    </li>
                    <li>
                        <button id="escritorio" class="boton-menu boton-categoria">
                            <i class="bi bi-hand-index-thumb"></i> COMPUTADORAS DE ESCRITORIO
                        </button>
                    </li>
                    <li>
                        <button id="laptop" class="boton-menu boton-categoria">
                            <i class="bi bi-hand-index-thumb"></i> LAPTOP
                        </button>
                    </li>
                    <li>
                        <button id="punto_venta" class="boton-menu boton-categoria">
                            <i class="bi bi-hand-index-thumb"></i> PUNTO DE VENTA
                        </button>
                    </li>
                </ul>
            </nav>
            <footer>
                <p class="texto-footer">© 2026 REPTEC</p>
            </footer>
        </aside>

        <main>
            <h2 class="titulo-principal" id="titulo-principal">Todos los productos</h2>
            <div id="contenedor-productos" class="contenedor-productos"></div>
        </main>
    </div>
    <div id="modal-imagen" class="modal-overlay">
        <span id="cerrar-modal" class="modal-close">&times;</span>
        <img class="modal-content" id="img-ampliada" alt="Imagen ampliada">
        <p id="modal-titulo"></p>
    </div>

    <!-- AQUÍ ESTÁ LA RUTA EXACTA -->
    <script src="./js/main.js"></script>
</body>

</html>
